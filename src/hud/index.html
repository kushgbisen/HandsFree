<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HandsFree</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font: 14px system-ui, -apple-system, sans-serif;
        background: #0a0a0a;
        color: #eee;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main { width: 100%; max-width: 480px; text-align: center; }
      h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
      h1 span { color: #facc15; }
      #status {
        margin-top: 6px;
        font-size: 13px;
        color: #a3a3a3;
        min-height: 18px;
      }
      #status.busy { color: #facc15; }
      #status.ok { color: #22c55e; }
      #status.err { color: #ef4444; }
      #bar {
        margin-top: 20px;
        display: flex;
        gap: 8px;
        background: #141414;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 8px;
      }
      #bar:focus-within { border-color: #facc15; }
      #mic {
        flex: none;
        width: 44px; height: 44px;
        border-radius: 12px;
        border: 0;
        background: #fff;
        color: #000;
        font-size: 19px;
        cursor: pointer;
      }
      #mic.listening { background: #ef4444; color: #fff; animation: pulse 1s infinite; }
      #mic.working { background: #facc15; }
      @keyframes pulse { 50% { opacity: 0.55; } }
      #cmd {
        flex: 1; min-width: 0;
        background: transparent;
        border: 0;
        color: #fff;
        font-size: 15px;
        outline: none;
      }
      #cmd::placeholder { color: #525252; }
      #go {
        flex: none;
        padding: 0 18px;
        border-radius: 12px;
        border: 0;
        background: #facc15;
        color: #000;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      #go:disabled { opacity: 0.4; cursor: default; }
      #go:hover:not(:disabled) { background: #fde047; }
      #result {
        margin-top: 16px;
        min-height: 22px;
        font-size: 14px;
        color: #d4d4d4;
      }
      #result:empty { display: none; }
      #demo {
        margin-top: 48px;
        padding-top: 16px;
        border-top: 1px solid #1c1c1c;
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      #demo button, #demo input {
        padding: 8px 14px;
        border-radius: 9px;
        border: 1px solid #2a2a2a;
        background: #141414;
        color: #d4d4d4;
        font-size: 13px;
      }
      #demo button { cursor: pointer; }
      #demo button:hover { border-color: #facc15; color: #facc15; }
      #demo input { background: #0a0a0a; min-width: 140px; }
      #demo input:focus { outline: 2px solid #facc15; }
      #demo-label {
        width: 100%;
        font-size: 11px;
        color: #525252;
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hands<span>Free</span></h1>
      <div id="status">Tap mic or type below</div>

      <div id="bar">
        <button id="mic" title="Voice input" aria-label="Voice input">🎤</button>
        <input id="cmd" placeholder="Try &quot;click sign in&quot;" autocomplete="off" autofocus aria-label="Command" />
        <button id="go">→</button>
      </div>

      <div id="result" aria-live="polite"></div>

      <div id="demo">
        <div id="demo-label">test targets — the agent clicks these</div>
        <button>Sign In</button>
        <button>Sign Up</button>
        <input placeholder="Email" aria-label="Email test field" />
      </div>
    </main>

    <script>
      const mic = document.getElementById('mic');
      const cmd = document.getElementById('cmd');
      const go = document.getElementById('go');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      const examples = ['click sign in', 'go to example.com', 'go to hacker news', 'fill Email with test@example.com'];
      let ex = 0;
      setInterval(() => {
        if (document.activeElement !== cmd && !cmd.value)
          cmd.placeholder = 'Try "' + examples[ex++ % examples.length] + '"';
      }, 3000);

      function setStatus(t, cls) {
        status.textContent = t;
        status.className = cls || '';
      }

      let busy = false;
      function send(text) {
        text = (text || cmd.value || '').trim();
        if (!text || busy) return;
        busy = true;
        go.disabled = true;
        mic.classList.add('working');
        mic.textContent = '■';
        cmd.value = text;
        result.textContent = '';
        setStatus('Working — "' + text + '" · tap ■ to stop', 'busy');

        fetch('/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        })
          .then(async (res) => {
            const d = await res.json().catch(() => ({}));
            if (d.interrupted) {
              result.textContent = '⚡ Stopped';
              setStatus('Stopped — try another command');
            } else if (d.verification?.success || res.ok) {
              result.textContent = '✓ ' + (d.candidate?.description || d.message || 'Done');
              setStatus('Done', 'ok');
            } else {
              result.textContent = '✗ ' + (d.message || 'Failed — rephrase and try again');
              setStatus('Failed — tap mic or retype', 'err');
            }
          })
          .catch(() => {
            result.textContent = '✗ No server — run `npm run dev`';
            setStatus('Server unreachable', 'err');
          })
          .finally(() => {
            busy = false;
            go.disabled = false;
            mic.classList.remove('working');
            mic.textContent = listening ? '●' : '🎤';
            cmd.select();
          });
      }

      // mic: tap to talk, tap ■ to stop (same button)
      let rec = null, listening = false;
      if (!SR) {
        mic.disabled = true;
        mic.title = 'Voice needs Chrome — type instead';
        setStatus('Voice needs Chrome — just type below');
      } else {
        rec = new SR();
        rec.continuous = false;
        rec.interimResults = true;
        rec.lang = 'en-US';
        rec.onstart = () => {
          listening = true;
          mic.classList.add('listening');
          mic.textContent = '●';
          setStatus('Listening…', 'busy');
        };
        rec.onend = () => {
          listening = false;
          mic.classList.remove('listening');
          if (!busy) {
            mic.textContent = '🎤';
            if (status.textContent === 'Listening…') setStatus('Tap mic or type below');
          }
        };
        rec.onerror = (e) => {
          listening = false;
          mic.classList.remove('listening');
          mic.textContent = '🎤';
          setStatus(
            e.error === 'not-allowed'
              ? 'Mic blocked — click 🔒 → Allow, or just type'
              : 'Mic issue — just type below',
            'err',
          );
        };
        rec.onresult = (e) => {
          const r = e.results[e.results.length - 1];
          cmd.value = r[0].transcript;
          if (r.isFinal && cmd.value.trim()) send(cmd.value.trim());
        };
      }
      mic.addEventListener('click', () => {
        if (busy) {
          // one-tap stop: same button aborts the running task
          fetch('/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: 'stop' }),
          }).catch(() => {});
          return;
        }
        if (!rec) { cmd.focus(); return; }
        if (listening) rec.stop();
        else try { rec.start(); } catch { /* busy */ }
      });

      go.addEventListener('click', () => send());
      cmd.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });

      // demo targets are real — clicking proves they work, voice does the same
      document.querySelectorAll('#demo button').forEach((el) => {
        el.addEventListener('click', () => {
          if (el.textContent.includes('Sign In')) { location.hash = 'signed-in'; el.textContent = 'Signed in ✓'; }
          else if (el.textContent.includes('Sign Up')) { location.hash = 'signed-up'; el.textContent = 'Signed up ✓'; }
        });
      });
    </script>
  </body>
</html>
