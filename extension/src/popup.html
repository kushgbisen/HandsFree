<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { width: 360px; padding: 0; font: 13px/1.5 system-ui, -apple-system, sans-serif; background: #0F1115; color: #F2EFE7; }
      header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #1E2228; }
      header h1 { font: 700 13px ui-monospace, monospace; letter-spacing: -0.02em; }
      header small { margin-left: auto; font-size: 11px; color: #7A8696; }
      .dot { width: 7px; height: 7px; background: #7A9E7E; border-radius: 50%; flex-shrink: 0; }
      .dot.none { background: #3A414D; }
      .card { margin: 12px 14px 0; background: #171A20; border: 1px solid #242A33; border-radius: 12px; padding: 12px; }
      .card:last-of-type { margin-bottom: 12px; }
      .step { font-size: 11px; font-weight: 700; color: #FFB84D; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
      label { display: block; font-size: 11px; font-weight: 600; color: #A8B0BE; margin: 8px 0 6px; letter-spacing: 0.02em; text-transform: uppercase; }
      label:first-of-type { margin-top: 0; }
      .hint { font-size: 11px; color: #7A8696; line-height: 1.4; margin-bottom: 4px; }
      .hint a { color: #FFB84D; text-decoration: none; }
      .hint a:hover { text-decoration: underline; }
      select, input { width: 100%; padding: 10px 12px; background: #0F1115; border: 1px solid #2A303C; border-radius: 10px; color: #F2EFE7; font-size: 12px; }
      select { cursor: pointer; }
      input { font-family: ui-monospace, monospace; padding-right: 38px; }
      select:focus, input:focus { outline: none; border-color: #FFB84D; box-shadow: 0 0 0 3px rgba(255,184,77,0.15); }
      .input-row { position: relative; display: flex; align-items: center; }
      .eye { position: absolute; right: 6px; width: 28px; height: 28px; display: grid; place-items: center; background: #1E2228; border: 1px solid #2A303C; border-radius: 8px; color: #A8B0BE; cursor: pointer; font-size: 13px; }
      .eye:hover { background: #242A33; color: #F2EFE7; }
      .btn-row { display: flex; gap: 8px; margin-top: 10px; }
      button#save { flex: 1; padding: 11px; background: #F2EFE7; color: #0F1115; border: 0; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
      button#save:hover { background: #fff; }
      button#save.saved { background: #7A9E7E; color: #fff; }
      button#test { padding: 11px 14px; background: transparent; color: #F2EFE7; border: 1px solid #2A303C; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; }
      button#test:hover { border-color: #FFB84D; }
      button#test:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 8px; font-size: 11px; text-align: center; min-height: 14px; font-weight: 500; }
      #status.ok { color: #7A9E7E; }
      #status.err { color: #E84855; }
      .badge { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; background: #0F1115; border: 1px solid #242A33; border-radius: 8px; font-size: 11px; }
      .badge.none { display: none; }
      .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #7A9E7E; flex-shrink: 0; }
      .badge-text { color: #A8B0BE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      footer { padding: 10px 14px 14px; text-align: center; font-size: 11px; color: #5A6474; }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot none"></span>
      <h1>HandsFree</h1>
      <small>voice control</small>
    </header>

    <div class="card">
      <div class="step">1 · Provider &amp; model</div>
      <label for="provider">Provider</label>
      <select id="provider">
        <option value="aistudio">Google AI Studio — free Gemini</option>
        <option value="openrouter">OpenRouter — many models, one key</option>
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
      </select>
      <label for="model">Model</label>
      <input id="model" autocomplete="off" spellcheck="false" />
      <div class="hint" id="modelHint"></div>
    </div>

    <div class="card">
      <div class="step">2 · API key</div>
      <div class="hint" id="keyHint"></div>
      <div class="input-row">
        <input id="key" type="password" autocomplete="off" spellcheck="false" />
        <button class="eye" id="eye" title="Show/hide" aria-label="Show/hide">👁</button>
      </div>
      <div class="btn-row">
        <button id="save">Save</button>
        <button id="test">Test</button>
      </div>
      <div id="status"></div>
      <div id="badge" class="badge none">
        <span class="badge-dot"></span>
        <span id="badgeText" class="badge-text"></span>
      </div>
    </div>

    <footer>Key stays in <code>chrome.storage.local</code> — sent only to your provider.</footer>
    <script src="popup.js"></script>
  </body>
</html>
